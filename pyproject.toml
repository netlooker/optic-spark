[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, B = bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter, not enforced as error
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]  # allow function calls in test default args

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
